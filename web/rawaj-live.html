<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رواج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E6E8; --card:#FFFFFF; --text:#26282C; --muted:#4A4D52; --faint:#7A7E85; --border:#D2D5D8;
  --primary:#26282C; --primary2:#34373C; --soft:#C6FF0059; --on-primary:#C6FF00; --neon:#C6FF00;
  --success:#12A26B; --warning:#B07800; --danger:#D6334C; --link:#26282C;
  --shadow:0 1px 2px rgba(20,22,43,.04),0 4px 14px rgba(20,22,43,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17181B; --card:#222428; --text:#F1F2F3; --muted:#A6A9AE; --faint:#80848A; --border:#33363B;
    --primary:#C6FF00; --primary2:#B5EA00; --soft:#C6FF0026; --on-primary:#26282C;
    --success:#2BC48A; --warning:#E3A82B; --danger:#F05A70; --link:#C6FF00; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#17181B; --card:#222428; --text:#F1F2F3; --muted:#A6A9AE; --faint:#80848A; --border:#33363B;
  --primary:#C6FF00; --primary2:#B5EA00; --soft:#C6FF0026; --on-primary:#26282C;
  --success:#2BC48A; --warning:#E3A82B; --danger:#F05A70; --link:#C6FF00; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px}
button,input,textarea,select{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media (min-width:600px){#app{border-inline:1px solid var(--border)}}
header.bar{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--border);min-height:60px}
header.bar h1{flex:1;margin:0;font-size:17px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--card);display:grid;place-items:center;cursor:pointer;flex-shrink:0;position:relative}
.ib svg{width:19px;height:19px}
main{flex:1;overflow-y:auto;padding:16px 14px 24px;display:flex;flex-direction:column;gap:12px}
nav.tabs{display:flex;background:var(--card);border-top:1px solid var(--border);padding:6px 4px calc(10px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;background:none;border:0;padding:6px 0 2px;color:var(--faint);font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
nav.tabs svg{width:22px;height:22px}
nav.tabs button.on{color:var(--text)}
nav.tabs button.on::before{content:"";position:absolute;top:-6px;width:30px;height:3px;border-radius:0 0 3px 3px;background:var(--neon)}
.bdg{position:absolute;top:0;inset-inline-start:calc(50% + 4px);min-width:17px;height:17px;border-radius:9px;background:var(--danger);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.card.tap{cursor:pointer}
.card.tap:active{transform:scale(.985)}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.t{font-size:16px;font-weight:700;margin:0;line-height:1.45}
.m{color:var(--muted);font-size:13.5px;line-height:1.6;margin:0}
.s{color:var(--faint);font-size:12px}
.big{font-size:22px;font-weight:700}
.row{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:2px 0}
.row .l{color:var(--muted)} .row .v{font-weight:600;text-align:left}
.row.tot{border-top:1px dashed var(--border);padding-top:8px;margin-top:2px;font-size:15.5px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.b-ok{background:color-mix(in srgb,var(--success) 14%,transparent);color:var(--success);border-color:transparent}
.b-warn{background:color-mix(in srgb,var(--warning) 14%,transparent);color:var(--warning);border-color:transparent}
.b-bad{background:color-mix(in srgb,var(--danger) 13%,transparent);color:var(--danger);border-color:transparent}
.b-neon{background:var(--soft);color:var(--text);border-color:transparent}
.btn{width:100%;padding:13px;border-radius:13px;font-size:15.5px;font-weight:600;cursor:pointer;border:1px solid var(--primary);background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;gap:8px}
.btn.o{background:transparent;color:var(--text);border-color:var(--border)}
.btn.d{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.sm{width:auto;white-space:nowrap;flex-shrink:0;padding:8px 14px;font-size:13.5px;border-radius:11px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btns{display:flex;gap:8px}
.btns .btn{flex:1}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
label.f small{font-weight:400;color:var(--faint);font-size:12px}
.in{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--card);font-size:15px;outline:none}
.in:focus{border-color:var(--text);box-shadow:0 0 0 3px var(--soft)}
textarea.in{min-height:90px;resize:vertical;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:99px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--text);background:var(--soft);font-weight:600}
.chip .pl{width:20px;height:20px}
.pl{display:inline-block;width:24px;height:24px;border-radius:7px;overflow:hidden;flex-shrink:0}
.pl svg{width:100%;height:100%;display:block}
.pls{display:flex;gap:4px}
.empty{text-align:center;padding:36px 18px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{width:52px;height:52px;opacity:.45}
.empty b{color:var(--text);font-size:16px}
.note{font-size:13px;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 12px;line-height:1.7}
.warn{font-size:13px;color:var(--warning);background:color-mix(in srgb,var(--warning) 12%,transparent);border-radius:12px;padding:10px 12px;line-height:1.7}
.err{font-size:13px;color:var(--danger);min-height:0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:13px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.kpi b{font-size:20px}
.kpi.hero{grid-column:1/-1;background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.kpi.hero .s{color:inherit;opacity:.8}
.kpi.tap{cursor:pointer}
.sec{font-size:13px;font-weight:700;color:var(--muted);margin:6px 2px -2px}
.filter{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.filter .chip{white-space:nowrap;padding:6px 12px;font-size:13px}
.av{width:42px;height:42px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:700;flex-shrink:0;font-size:17px}
.av.lg{width:72px;height:72px;font-size:28px}
.who{display:flex;gap:10px;align-items:center}
.who>div{min-width:0}
.vf{display:inline-block;width:15px;height:15px;vertical-align:-2px;margin-inline-start:3px}
.track{display:flex;gap:4px}
.track i{flex:1;height:5px;border-radius:3px;background:var(--border)}
.track i.on{background:var(--success)}
.track i.cur{background:var(--text)}
.tl{display:flex;flex-direction:column}
.tl div{display:flex;gap:10px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.tl div:last-child{border-bottom:0}
.tl span.s{white-space:nowrap}
.msgs{display:flex;flex-direction:column;gap:6px}
.msg{max-width:80%;padding:8px 12px;border-radius:14px;font-size:14.5px;line-height:1.55;word-wrap:break-word}
.msg.me{align-self:flex-start;background:color-mix(in srgb,var(--neon) 30%,var(--card));border-bottom-right-radius:4px}
.msg.them{align-self:flex-end;background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg .s{display:block;font-size:10.5px;margin-top:2px}
.msg.sys{align-self:center;background:transparent;color:var(--faint);font-size:12px;text-align:center}
.comp{display:flex;gap:8px;align-items:flex-end}
.comp textarea{flex:1;min-height:44px;max-height:120px;border-radius:22px;padding:11px 16px;resize:none}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.send svg{width:19px;height:19px}
.sheet-wrap{position:absolute;inset:0;background:rgba(10,11,16,.5);display:flex;align-items:flex-end;z-index:30}
.sheet{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow-y:auto}
.toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:90%;text-align:center}
.splash{flex:1;display:grid;place-items:center;align-content:center;gap:14px;text-align:center}
.splash h2{margin:0;font-size:34px}
.onb{flex:1;display:flex;flex-direction:column;padding:28px 22px calc(22px + env(safe-area-inset-bottom));gap:18px;overflow-y:auto}
.onb .ill{flex:1;display:grid;place-items:center;align-content:center;gap:18px;text-align:center;min-height:300px}
.onb h2{margin:0;font-size:24px;line-height:1.4}
.onb p{margin:0;color:var(--muted);line-height:1.8;font-size:15.5px;max-width:380px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--border)}
.dots i.on{width:22px;background:var(--text)}
.bigic{width:110px;height:110px;border-radius:32px;background:var(--card);border:1px solid var(--border);display:grid;place-items:center}
.bigic svg{width:54px;height:54px}
.role{display:flex;gap:14px;align-items:center;padding:16px;border:1.5px solid var(--border);border-radius:16px;background:var(--card);cursor:pointer;text-align:right;width:100%}
.role.on{border-color:var(--text);background:var(--soft)}
.role .ic{width:48px;height:48px;border-radius:14px;background:var(--bg);display:grid;place-items:center;flex-shrink:0}
.role .ic svg{width:26px;height:26px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.7;cursor:pointer}
.check input{width:20px;height:20px;margin-top:3px;accent-color:#26282C;flex-shrink:0}
a{color:var(--link)}
.lnk{background:none;border:0;padding:0;color:var(--link);text-decoration:underline;cursor:pointer;font-size:13.5px}
.split{display:flex;gap:8px}
.split>*{flex:1;min-width:0}
.cd{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ============ الإعدادات المعتمدة ============ */
const BRAND_FEE = 0.05, CREATOR_FEE = 0.10, MIN_FEE = 25, FIRST_DEAL_OFF = 0.5, VAT = 0.15, AUTO_RELEASE_H = 72;
const MIN_BUDGET = 100, MIN_WITHDRAW = 50;
const PLATFORMS = { snapchat:'سناب شات', instagram:'انستقرام', tiktok:'تيك توك' };
const NICHES = ['أزياء','تجميل','مطاعم وكافيهات','تقنية','سفر وسياحة','صحة ورياضة','عائلة وأطفال','سيارات','عقار','ألعاب','تعليم','أخرى'];
const FOLLOWERS = ['أقل من 10 آلاف','10–50 ألف','50–100 ألف','100–500 ألف','500 ألف – مليون','أكثر من مليون'];
const CONTENT = ['سناب ستوري','ريلز','فيديو تيك توك','بوست','زيارة وتغطية','بث مباشر'];
const CITIES = ['الرياض','جدة','مكة','المدينة','الدمام','الخبر','أبها','تبوك','القصيم','أخرى'];

/* ============ أدوات ============ */
const r2 = n => Math.round(n * 100) / 100;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sar = n => (Number(n) || 0).toLocaleString('en-US', { maximumFractionDigits:2 }) + ' ر.س';
const ago = t => { const d = (Date.now() - t) / 6e4; if (d < 1) return 'الآن'; if (d < 60) return `قبل ${Math.floor(d)} د`; if (d < 1440) return `قبل ${Math.floor(d/60)} س`; return new Date(t).toLocaleDateString('ar-SA-u-ca-gregory-nu-latn', { day:'numeric', month:'short' }); };
const dt = t => new Date(t).toLocaleString('ar-SA-u-ca-gregory-nu-latn', { day:'numeric', month:'short', hour:'numeric', minute:'2-digit' });
const initial = s => (String(s || '؟').trim()[0] || '؟');
function brandFees(price, first){ const full = r2(price * BRAND_FEE); const fee = first ? r2(full * (1 - FIRST_DEAL_OFF)) : full; const vat = r2(fee * VAT); return { full, fee, vat, total:r2(price + fee + vat) }; }
function creatorCut(price, brandFee){ let c = r2(price * CREATOR_FEE); if (price > 0 && c + brandFee < MIN_FEE) c = Math.min(price, r2(MIN_FEE - brandFee)); return { commission:c, payout:r2(price - c) }; }
function mask(text){
  let hit = false;
  const out = String(text)
    .replace(/[\w.+-]+@[\w-]+\.[\w.]+/g, () => (hit = true, '•••'))
    .replace(/(https?:\/\/)?(wa\.me|t\.me|api\.whatsapp\.com|chat\.whatsapp\.com)\/\S*/gi, () => (hit = true, '•••'))
    .replace(/(\+|00)?[\d٠-٩][\d٠-٩\s-]{7,}[\d٠-٩]/g, () => (hit = true, '•••'));
  return { out, hit };
}

/* ============ أيقونات ============ */
const I = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  deals:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/><path d="M6 6V5a2 2 0 0 1 2-2h9"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.6-5 6.5-5s5.5 1.5 6.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.3 0 4 1.3 4.6 4"/></svg>',
  bank:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9 12 4l9 5M5 10v8M10 10v8M14 10v8M19 10v8M3 20h18"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4 3 11l6 2.5L11.5 20z" transform="scale(-1 1) translate(-23 0)"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>',
  store:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16l-1.5-5h-13zM5 9v11h14V9M9 20v-6h6v6"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="13" height="14" rx="3"/><path d="m16 10 5-3v10l-5-3"/></svg>',
  inbox:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5 5h14l2 8v6H3v-6z"/></svg>',
  coins:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>',
  admin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/><circle cx="12" cy="11" r="2.5"/><path d="M8 17c.8-1.6 2.2-2.5 4-2.5s3.2.9 4 2.5"/></svg>',
};
const VF = '<svg class="vf" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#12A26B"/><path d="m7 12.5 3.2 3L17 9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const GHOST = 'M12 3.6c-2.6 0-4.5 2-4.5 4.6v2.1c-.5.1-1 .1-1.3.3-.3.2 0 .6.4.8l.9.4c-.5 1.4-1.6 2.7-3 3.2-.3.1-.3.5 0 .6.6.3 1.3.4 1.9.6.2.4.1 1 .5 1.1.6.1 1.3-.2 2 0 .9.3 1.7 1.3 3.1 1.3s2.2-1 3.1-1.3c.7-.2 1.4.1 2 0 .4-.1.3-.7.5-1.1.6-.2 1.3-.3 1.9-.6.3-.1.3-.5 0-.6-1.4-.5-2.5-1.8-3-3.2l.9-.4c.4-.2.7-.6.4-.8-.3-.2-.8-.2-1.3-.3V8.2c0-2.6-1.9-4.6-4.5-4.6z';
const NOTE = 'M13 5h2.4c.3 1.7 1.5 2.9 3.2 3.1v2.4c-1.2 0-2.3-.4-3.2-1v5.3a4.2 4.2 0 1 1-4.2-4.2v2.4a1.8 1.8 0 1 0 1.8 1.8z';
let igN = 0;
const PL = {
  snapchat:() => `<svg viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#FFFC00"/><path d="${GHOST}" fill="#fff" stroke="#111" stroke-width="1"/></svg>`,
  instagram:() => { const id = 'ig' + (++igN); return `<svg viewBox="0 0 24 24"><defs><radialGradient id="${id}" cx="28%" cy="105%" r="140%"><stop offset="0" stop-color="#FDF497"/><stop offset=".08" stop-color="#FDF497"/><stop offset=".45" stop-color="#FD5949"/><stop offset=".62" stop-color="#D6249F"/><stop offset=".92" stop-color="#285AEB"/></radialGradient></defs><rect width="24" height="24" rx="6" fill="url(#${id})"/><rect x="5" y="5" width="14" height="14" rx="4.2" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="12" r="3.3" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="16.3" cy="7.7" r="1.05" fill="#fff"/></svg>`; },
  tiktok:() => `<svg viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#000"/><path d="${NOTE}" fill="#25F4EE" transform="translate(-.8 -.6)"/><path d="${NOTE}" fill="#FE2C55" transform="translate(.8 .6)"/><path d="${NOTE}" fill="#fff"/></svg>`,
};

/* ============ الحالة ============ */
const S = {
  phase:'boot', db:null, user:null, uid:null, isOwner:false, canWrite:null, readOnly:false,
  profiles:{}, verif:{}, offers:[], deals:[], payouts:{}, msgs:[], msgsDeal:null,
  loaded:{ profiles:false, offers:false, deals:false, verif:false },
  mode:null, tab:'home', stack:[], onbStep:0, form:{}, sheet:null, toast:null, busy:false,
};
const LS = { get(k){ try { return localStorage.getItem('rawaj.' + k); } catch { return null; } }, set(k, v){ try { localStorage.setItem('rawaj.' + k, v); } catch {} } };
const me = () => S.profiles[S.uid];
const view = () => S.stack[S.stack.length - 1] || { v:S.tab };
const nameOf = (uid, as) => { const p = S.profiles[uid]; return (p && p[as] && p[as].name) || (as === 'brand' ? 'براند' : 'مسوق'); };
const vstatus = uid => { const v = S.verif[uid]; if (!v || !v.status) return 'pending'; if (v.status === 'rejected' && (S.profiles[uid]?.updatedAt || 0) > (v.at || 0)) return 'pending'; return v.status; };
const isVerified = uid => vstatus(uid) === 'verified';
const isSuspended = uid => vstatus(uid) === 'suspended';
const offerOf = id => S.offers.find(o => o.id === id);
const dealOf = id => S.deals.find(d => d.id === id);
const myDeals = () => S.deals.filter(d => S.mode === 'brand' ? d.brandId === S.uid : d.mktId === S.uid).sort((a, b) => b.updatedAt - a.updatedAt);
const myRoleIn = d => S.mode === 'admin' ? 'admin' : (S.mode === 'brand' && d.brandId === S.uid ? 'brand' : (S.mode === 'mkt' && d.mktId === S.uid ? 'mkt' : null));

const STATUS = {
  proposed:{ t:'تفاوض', c:'b-warn' }, agreed:{ t:'بانتظار الدفع', c:'b-warn' }, funded:{ t:'قيد التنفيذ', c:'b-neon' },
  delivered:{ t:'بانتظار الاعتماد', c:'b-neon' }, completed:{ t:'مكتملة', c:'b-ok' }, disputed:{ t:'نزاع', c:'b-bad' },
  rejected:{ t:'مرفوضة', c:'' }, cancelled:{ t:'ملغاة', c:'' }, refunded:{ t:'مستردة', c:'b-bad' },
};
const ACTIVE = ['proposed','agreed','funded','delivered','disputed'];
const stBadge = s => `<span class="badge ${STATUS[s]?.c || ''}">${STATUS[s]?.t || s}</span>`;
const vBadge = uid => { const s = vstatus(uid); return s === 'verified' ? '<span class="badge b-ok">موثّق</span>' : s === 'rejected' ? '<span class="badge b-bad">التوثيق مرفوض</span>' : s === 'suspended' ? '<span class="badge b-bad">موقوف</span>' : '<span class="badge b-warn">قيد التوثيق</span>'; };

function needsMe(d){
  if (S.mode === 'brand' && d.brandId === S.uid) return (d.status === 'proposed' && d.turn === 'brand') || d.status === 'agreed' || d.status === 'delivered';
  if (S.mode === 'mkt' && d.mktId === S.uid) return (d.status === 'proposed' && d.turn === 'mkt') || d.status === 'funded';
  return false;
}
const isFirstDealFor = brandId => !S.deals.some(d => d.brandId === brandId && d.fundedAt);

/* ============ التشغيل ============ */
async function boot(){
  render();
  const t0 = Date.now();
  let db = null, user = null;
  try { [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); } catch {}
  await new Promise(r => setTimeout(r, Math.max(0, 900 - (Date.now() - t0))));
  if (!db || !user){ S.phase = 'nodb'; return render(); }
  S.db = db; S.user = user;
  try { S.uid = await user.id(); } catch {}
  if (!S.uid){ S.phase = 'nodb'; return render(); }
  S.isOwner = await user.isOwner().catch(() => false);
  S.canWrite = await user.can('data.write').catch(() => null);
  if (S.canWrite === false && !S.isOwner){ S.phase = 'readonly'; return render(); }
  subscribe();
  S.phase = 'loading'; render();
}
function subscribe(){
  const err = e => toast('تعذر الاتصال: ' + (e && e.message || ''));
  S.db.collection('profiles').onSnapshot(q => { S.profiles = {}; q.docs.forEach(d => S.profiles[d.id] = d.data()); S.loaded.profiles = true; ready(); }, err);
  S.db.collection('verif').onSnapshot(q => { S.verif = {}; q.docs.forEach(d => S.verif[d.id] = d.data()); S.loaded.verif = true; ready(); }, () => { S.loaded.verif = true; ready(); });
  S.db.collection('offers').onSnapshot(q => { S.offers = q.docs.map(d => ({ id:d.id, ...d.data() })); S.loaded.offers = true; ready(); }, err);
  S.db.collection('deals').onSnapshot(q => { S.deals = q.docs.map(d => ({ id:d.id, ...d.data() })); S.loaded.deals = true; ready(); autoRelease(); }, err);
  if (S.isOwner) S.db.collection('payouts').onSnapshot(q => { S.payouts = {}; q.docs.forEach(d => S.payouts[d.id] = d.data()); render(); }, () => {});
  else S.db.doc('payouts/' + S.uid).onSnapshot(s => { S.payouts = s.exists ? { [S.uid]:s.data() } : {}; render(); }, () => {});
  setInterval(() => { autoRelease(); if (view().v === 'deal') render(); }, 30000);
}
function ready(){
  if (S.phase === 'loading' && S.loaded.profiles && S.loaded.offers && S.loaded.deals && S.loaded.verif){
    const p = me();
    if (S.isOwner){ S.mode = LS.get('mode') || 'admin'; if (S.mode !== 'admin' && !(p && p[S.mode])) S.mode = 'admin'; S.phase = 'app'; S.tab = defaultTab(); }
    else if (p && p.role){ S.mode = p.role; S.phase = 'app'; S.tab = defaultTab(); }
    else { S.phase = 'onboard'; S.onbStep = 0; }
  }
  render();
}
const defaultTab = () => S.mode === 'admin' ? 'dash' : S.mode === 'brand' ? 'home' : 'explore';

/* ============ الكتابة ============ */
async function guard(fn, okMsg){
  if (S.busy) return; S.busy = true; render();
  try { await fn(); if (okMsg) toast(okMsg); }
  catch (e){ console.error(e); toast(e && e.code === 'invalid_argument' ? 'ما عندك صلاحية تعديل في هذا الرابط' : 'صار خطأ، حاول مرة ثانية'); }
  finally { S.busy = false; render(); }
}
const logEntry = (a, extra = {}) => ({ t:Date.now(), by:S.uid, as:S.mode, a, ...extra });
async function updDeal(d, patch, a, extra){
  const log = (d.log || []).concat(logEntry(a, extra));
  await S.db.doc('deals/' + d.id).update({ ...patch, log, updatedAt:Date.now() });
}
async function sysMsg(dealId, text){ await S.db.collection('deals/' + dealId + '/msgs').add({ by:'sys', text, t:Date.now() }); }
const releasing = new Set();
async function autoRelease(){
  const now = Date.now();
  for (const d of S.deals){
    if (d.status !== 'delivered' || !d.deliveredAt || releasing.has(d.id)) continue;
    if (now < d.deliveredAt + AUTO_RELEASE_H * 36e5) continue;
    if (!(S.isOwner || d.brandId === S.uid || d.mktId === S.uid)) continue;
    releasing.add(d.id);
    const cut = creatorCut(d.price, d.brandFee || 0);
    try {
      await S.db.doc('deals/' + d.id).update({ status:'completed', completedAt:now, commission:cut.commission, payout:cut.payout, autoReleased:true, updatedAt:now, log:(d.log || []).concat({ t:now, by:'sys', a:'تحرير تلقائي بعد 72 ساعة من التسليم' }) });
      await sysMsg(d.id, 'تحرر المبلغ تلقائياً بعد مرور 72 ساعة على التسليم.');
    } catch {}
  }
}

let lastKey = '';
function go(v, p = {}){ S.stack.push({ v, ...p }); openMsgs(); render(); document.querySelector('main')?.scrollTo(0, 0); }
function back(){ S.stack.pop(); openMsgs(); render(); }
function setTab(t){ S.tab = t; S.stack = []; openMsgs(); render(); }
let unsubMsgs = null;
function openMsgs(){
  const v = view();
  const id = v.v === 'deal' ? v.id : null;
  if (id === S.msgsDeal) return;
  if (unsubMsgs){ unsubMsgs(); unsubMsgs = null; }
  S.msgsDeal = id; S.msgs = [];
  if (id) unsubMsgs = S.db.collection('deals/' + id + '/msgs').orderBy('t').onSnapshot(q => { S.msgs = q.docs.map(d => ({ id:d.id, ...d.data() })); render(); const m = document.getElementById('msgs'); if (m) m.scrollIntoView({ block:'end' }); }, () => {});
}
let toastT;
function toast(t){ S.toast = t; clearTimeout(toastT); toastT = setTimeout(() => { S.toast = null; render(); }, 2600); render(); }

/* ============ الرسم ============ */
function render(){
  const app = document.getElementById('app');
  const key = S.phase + '|' + S.mode + '|' + S.tab + '|' + JSON.stringify(view()) + '|' + (S.sheet && S.sheet.k);
  const keep = {}; let focus = null, scroll = 0;
  if (key === lastKey){
    app.querySelectorAll('input[id],textarea[id],select[id]').forEach(el => keep[el.id] = el.type === 'checkbox' ? el.checked : el.value);
    focus = document.activeElement && document.activeElement.id;
    scroll = app.querySelector('main')?.scrollTop || 0;
  }
  igN = 0;
  app.innerHTML = screen() + (S.sheet ? `<div class="sheet-wrap" data-a="closeSheet"><div class="sheet" data-stop>${sheet()}</div></div>` : '') + (S.toast ? `<div class="toast">${esc(S.toast)}</div>` : '');
  if (key === lastKey){
    for (const [id, v] of Object.entries(keep)){ const el = document.getElementById(id); if (el){ if (el.type === 'checkbox') el.checked = v; else el.value = v; } }
    if (focus){ const el = document.getElementById(focus); if (el){ el.focus(); try { const n = el.value.length; el.setSelectionRange(n, n); } catch {} } }
    const m = app.querySelector('main'); if (m) m.scrollTop = scroll;
  }
  lastKey = key;
}
function screen(){
  switch (S.phase){
    case 'boot': case 'loading': return `<div class="splash">${LOGO(104)}<h2>رواج</h2><p class="m">${S.phase === 'loading' ? 'جاري التحميل…' : ''}</p></div>`;
    case 'nodb': return `<div class="splash" style="padding:24px">${LOGO(88)}<h2>رواج</h2><p class="m" style="max-width:340px">سجّل دخولك بحسابك في Claude ثم افتح الرابط مرة ثانية، عشان نقدر نحفظ حسابك وصفقاتك.</p></div>`;
    case 'readonly': return `<div class="splash" style="padding:24px">${LOGO(88)}<h2>رواج</h2><p class="m" style="max-width:360px">رابطك الحالي للمشاهدة فقط، فما تقدر تسجل أو تنشر.<br>اطلب من إدارة رواج دعوتك بإيميلك عشان تقدر تستخدم التطبيق.</p></div>`;
    case 'onboard': return onboard();

  }

}

function countdown(d){ const ms = Math.max(0, d.deliveredAt + AUTO_RELEASE_H * 36e5 - Date.now()); const hh = Math.floor(ms / 36e5), mm = Math.floor(ms % 36e5 / 6e4); return `${hh} ساعة و${mm} دقيقة`; }
function actionBox(d, role, o){

    let a = '';

    return a;
  }
  if (!role) return '';
  switch (d.status){
    case 'proposed':
      if (d.turn === role) return box(`<b>${esc(other)}</b> ${d.log?.length > 1 ? 'رد بعرض جديد' : 'قدم على حملتك'} بسعر <b>${sar(d.price)}</b>${d.lastNote ? `<br>«${esc(d.lastNote)}»` : ''}`,
        `<div class="btns"><button class="btn" data-a="accept" data-id="${d.id}" ${B}>قبول</button><button class="btn o" data-a="sheet" data-v="recounter" data-id="${d.id}">عرض مضاد</button></div><button class="btn d" data-a="reject" data-id="${d.id}" ${B}>رفض</button>`);

        return box(`تم الاتفاق على ${sar(d.price)}. ادفع عشان ينحجز المبلغ في الضمان ويبدأ المسوق التنفيذ. الإجمالي <b>${sar(f.total)}</b>.`, `<button class="btn" data-a="sheet" data-v="pay" data-id="${d.id}">ادفع وأودع في الضمان</button>`);
      }
      return wait(`تم الاتفاق على ${sar(d.price)}. بانتظار دفع البراند، وبعدها تبدأ التنفيذ. ${isVerified(d.mktId) ? '' : 'لازم تتوثق رخصتك قبل الدفع.'}`);
    case 'funded':
      if (role === 'mkt') return box(`المبلغ محجوز في الضمان. نفّذ المطلوب خلال ${o.days || 7} أيام ثم أرسل رابط المنشور.`, `<button class="btn" data-a="sheet" data-v="deliver" data-id="${d.id}">تسليم المحتوى</button>`) + `<button class="lnk" data-a="sheet" data-v="dispute" data-id="${d.id}">فتح نزاع</button>`;

    case 'delivered': {
      const proof = `<div class="row"><span class="l">رابط المنشور</span><a href="${esc(d.proofUrl)}" target="_blank" rel="noopener noreferrer" dir="ltr" style="overflow:hidden;text-overflow:ellipsis;max-width:60%;white-space:nowrap">${esc(d.proofUrl)}</a></div>${d.proofNote ? `<p class="m">${esc(d.proofNote)}</p>` : ''}`;
      if (role === 'brand') return box(`سلّم المسوق المحتوى. راجعه واعتمده، أو افتح نزاع إذا فيه مشكلة. يتحرر تلقائياً بعد <b class="cd">${countdown(d)}</b>.${proof}`, `<button class="btn" data-a="approve" data-id="${d.id}" ${B}>اعتماد وتحرير المبلغ</button><button class="btn d" data-a="sheet" data-v="dispute" data-id="${d.id}">اعتراض</button>`);

  }

function money(d, role){

  return h + `<p class="s">${d.sandbox ? 'دفعة تجريبية: ما انخصم مبلغ حقيقي.' : ''}</p></div>`;

/* ---------- المحفظة ---------- */
function mktTotals(uid){
  const ds = S.deals.filter(d => d.mktId === uid);
  const earned = r2(ds.filter(d => d.status === 'completed').reduce((s, d) => s + (d.payout || 0), 0));
  const escrow = r2(ds.filter(d => ['funded','delivered','disputed'].includes(d.status)).reduce((s, d) => s + creatorCut(d.price, d.brandFee || 0).payout, 0));
  const reqs = (S.payouts[uid]?.requests) || [];
  const withdrawn = r2(reqs.filter(r => r.status !== 'rejected').reduce((s, r) => s + r.amount, 0));
  return { earned, escrow, available:r2(earned - withdrawn), reqs };
}
function mktWallet(){
  const t = mktTotals(S.uid);
  const done = S.deals.filter(d => d.mktId === S.uid && d.status === 'completed').sort((a, b) => b.completedAt - a.completedAt);
  let h = `<div class="kpis"><div class="kpi hero"><span class="s">متاح للسحب</span><b style="font-size:28px">${sar(t.available)}</b></div>

document.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && e.target.id && e.target.id.startsWith('chat_')){ e.preventDefault(); A.sendMsg(e.target.id.slice(5)); } });
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el){ return; }
  if (el.dataset.a === 'closeSheet' && e.target.closest('[data-stop]') && !e.target.closest('button')) return;
  const fn = A[el.dataset.a]; if (fn){ e.preventDefault(); fn(el.dataset.id, el.dataset.v, el); }
});
const A = {
  back, tab:(_, v) => setTab(v),
  go:(id, v, el) => { if (v === 'newOffer' || v === 'editProfile') S.form = {}; go(v, { id, as:el.dataset.as, role:el.dataset.role }); },
  fset:(_, v, el) => { S.form[el.dataset.k] = S.form[el.dataset.k] === v && !['pf','df','uf','af'].includes(el.dataset.k) ? '' : v; render(); },
  ftog:(_, v, el) => { const a = S.form[el.dataset.k] || (S.form[el.dataset.k] = []); const i = a.indexOf(v); i < 0 ? a.push(v) : a.splice(i, 1); render(); },
  sheet:(id, v) => { S.sheet = { k:v, id }; render(); },
  closeSheet:() => { S.sheet = null; render(); },
  onbNext:() => { S.onbStep++; render(); }, onbSkip:() => { S.onbStep = SLIDES.length; render(); },
  onbBack:() => { S.onbStep = SLIDES.length; render(); },
  pickRole:(_, v) => { S.form.role = v; render(); },
  onbRole:() => { const role = S.form.role; S.form = { role }; S.onbStep = SLIDES.length + 1; render(); },
  enterAdmin:() => { S.mode = 'admin'; LS.set('mode', 'admin'); S.phase = 'app'; S.tab = 'dash'; S.form = {}; render(); },
  switchMode:(_, v) => {
    if (v !== 'admin' && !(me() && me()[v])){ S.phase = 'onboard'; S.form = { role:v }; S.onbStep = SLIDES.length + 1; return render(); }
    S.mode = v; LS.set('mode', v); S.tab = defaultTab(); S.stack = []; S.form = {}; render();
  },
  saveProfile:(_, role) => {
    const F = S.form; const existing = me() && me()[role];
    const name = val('p_name');
    if (name.length < 2) return setErr('p_err', 'اكتب الاسم');
    const x = { name, niche:F.niche || '', city:F.city || '', bio:val('p_bio') };
    if (role === 'brand'){ x.cr = val('p_cr').replace(/\D/g, ''); if (!/^\d{10}$/.test(x.cr)) return setErr('p_err', 'رقم السجل التجاري لازم يكون 10 أرقام'); }
    else {
      x.handles = {}; for (const k of Object.keys(PLATFORMS)){ const h = val('p_h_' + k).replace(/^@/, ''); if (h) x.handles[k] = h; }
      if (!Object.keys(x.handles).length) return setErr('p_err', 'أضف حساب واحد على الأقل');
      x.followers = F.followers || ''; if (!x.followers) return setErr('p_err', 'اختر عدد المتابعين');
      x.license = val('p_lic'); if (x.license.length < 4) return setErr('p_err', 'اكتب رقم رخصة موثوق');
    }
    if (!x.niche) return setErr('p_err', 'اختر المجال');
    if (!existing && !document.getElementById('p_terms')?.checked) return setErr('p_err', 'لازم توافق على الشروط');
    const prev = me() || {};
    guard(async () => {
      const docData = { ...prev, role:S.isOwner ? (prev.role || role) : role, [role]:x, createdAt:prev.createdAt || Date.now(), updatedAt:Date.now() };
      await S.db.doc('profiles/' + S.uid).set(docData);
      S.profiles[S.uid] = docData;
      S.mode = role; if (S.isOwner) LS.set('mode', role);
      S.phase = 'app'; S.tab = defaultTab(); S.stack = []; S.form = {};
    }, existing ? 'انحفظت التعديلات' : 'أهلاً بك في رواج!');
  },
  publishOffer:() => {
    const F = S.form;
    const o = { title:val('o_title'), desc:val('o_desc'), platforms:F.platforms || [], content:F.content || [], budget:num('o_budget'), slots:Math.max(1, Math.min(50, Math.round(num('o_slots')) || 1)), days:Math.max(1, Math.min(60, Math.round(num('o_days')) || 7)) };
    if (o.title.length < 4) return setErr('o_err', 'اكتب عنوان الحملة');
    if (o.desc.length < 10) return setErr('o_err', 'اشرح المطلوب بتفصيل أكثر');
    if (!o.platforms.length) return setErr('o_err', 'اختر منصة واحدة على الأقل');
    if (!(o.budget >= MIN_BUDGET)) return setErr('o_err', `الحد الأدنى للميزانية ${MIN_BUDGET} ر.س`);
    guard(async () => { await S.db.collection('offers').add({ ...o, brandId:S.uid, status:'open', createdAt:Date.now() }); S.stack = []; S.tab = 'home'; S.form = {}; }, 'انتشرت الحملة');
  },
  closeOffer:id => guard(() => S.db.doc('offers/' + id).update({ status:'closed' }), 'انقفلت الحملة'),
  reopenOffer:id => guard(() => S.db.doc('offers/' + id).update({ status:'open' }), 'انفتحت الحملة'),
  apply:id => createDeal(id, offerOf(id).budget, ''),
  applyCounter:id => { const p = num('c_price'); if (!(p >= MIN_BUDGET)) return setErr('c_err', `أقل سعر ${MIN_BUDGET} ر.س`); createDeal(id, p, val('c_note')); },
  sendCounter:id => {
    const d = dealOf(id); const p = num('c_price'); const note = val('c_note');
    if (!(p >= MIN_BUDGET)) return setErr('c_err', `أقل سعر ${MIN_BUDGET} ر.س`);
    const role = myRoleIn(d);
    guard(async () => { await updDeal(d, { price:p, turn:role === 'brand' ? 'mkt' : 'brand', lastNote:note }, 'عرض مضاد', { price:p, note }); S.sheet = null; }, 'انرسل العرض');
  },
  accept:id => { const d = dealOf(id); guard(async () => { await updDeal(d, { status:'agreed', agreedAt:Date.now(), lastNote:'' }, 'تم الاتفاق', { price:d.price }); await sysMsg(id, `تم الاتفاق على ${sar(d.price)}. الخطوة الجاية: دفع البراند.`); }, 'تم الاتفاق'); },
  reject:id => { const d = dealOf(id); guard(() => updDeal(d, { status:'rejected' }, 'رفض العرض'), 'تم الرفض'); },
  withdraw:id => { const d = dealOf(id); guard(() => updDeal(d, { status:'cancelled' }, 'سحب العرض'), 'انسحب العرض'); },
  pay:id => {
    const d = dealOf(id); if (d.status !== 'agreed') return;
    const first = isFirstDealFor(d.brandId); const f = brandFees(d.price, first);
    guard(async () => { await updDeal(d, { status:'funded', fundedAt:Date.now(), brandFee:f.fee, vat:f.vat, total:f.total, firstDeal:first, sandbox:true }, 'دفع وإيداع في الضمان (تجريبي)', { price:f.total }); await sysMsg(id, `انحجز ${sar(d.price)} في الضمان. يقدر المسوق يبدأ التنفيذ.`); S.sheet = null; }, 'انحجز المبلغ في الضمان');
  },
  deliver:id => {
    const d = dealOf(id); const url = val('d_url');
    if (!/^https?:\/\/\S+\.\S+/.test(url)) return setErr('d_err', 'حط رابط صحيح يبدأ بـ https://');
    guard(async () => { await updDeal(d, { status:'delivered', deliveredAt:Date.now(), proofUrl:url, proofNote:val('d_note') }, 'تسليم المحتوى'); await sysMsg(id, 'سلّم المسوق المحتوى. عند البراند 72 ساعة للاعتماد أو الاعتراض.'); S.sheet = null; }, 'تم التسليم');
  },
  approve:id => { const d = dealOf(id); const c = creatorCut(d.price, d.brandFee || 0); guard(async () => { await updDeal(d, { status:'completed', completedAt:Date.now(), commission:c.commission, payout:c.payout }, 'اعتماد وتحرير المبلغ'); await sysMsg(id, `اعتمد البراند التنفيذ وتحرر ${sar(c.payout)} لمحفظة المسوق.`); }, 'تحرر المبلغ للمسوق'); },
  dispute:id => { const d = dealOf(id); const r = val('x_reason'); if (r.length < 5) return setErr('x_err', 'اشرح المشكلة'); guard(async () => { await updDeal(d, { status:'disputed', prevStatus:d.status, disputeBy:S.uid, disputeReason:r, disputedAt:Date.now() }, 'فتح نزاع', { note:r }); await sysMsg(id, 'انفتح نزاع. المبلغ موقوف لين تراجع الإدارة.'); S.sheet = null; }, 'انفتح النزاع'); },
  adminRelease:id => { const d = dealOf(id); if (!confirm('تحرير المبلغ للمسوق؟')) return; const c = creatorCut(d.price, d.brandFee || 0); guard(async () => { await updDeal(d, { status:'completed', completedAt:Date.now(), commission:c.commission, payout:c.payout, resolvedBy:'admin' }, 'قرار الإدارة: تحرير للمسوق'); await sysMsg(id, `قررت إدارة رواج تحرير ${sar(c.payout)} للمسوق.`); }, 'تم التحرير'); },
  adminRefund:id => { const d = dealOf(id); if (!confirm('استرداد كامل المبلغ للبراند؟')) return; guard(async () => { await updDeal(d, { status:'refunded', refundedAt:Date.now(), refund:d.total, resolvedBy:'admin' }, 'قرار الإدارة: استرداد للبراند', { price:d.total }); await sysMsg(id, `قررت إدارة رواج استرداد ${sar(d.total)} للبراند.`); }, 'تم الاسترداد'); },
  adminCancel:id => { const d = dealOf(id); if (!confirm('إلغاء الصفقة؟')) return; guard(() => updDeal(d, { status:'cancelled' }, 'ألغتها الإدارة'), 'انلغت'); },
  sendMsg:id => {
    const d = dealOf(id); const el = document.getElementById('chat_' + id); const raw = (el?.value || '').trim(); if (!raw) return;
    const { out, hit } = mask(raw); el.value = '';
    S.db.collection('deals/' + id + '/msgs').add({ by:S.uid, text:out, t:Date.now() }).then(() => { if (hit) toast('أخفينا بيانات التواصل. التعامل داخل رواج يحمي حقك.'); }).catch(() => { el.value = raw; toast('ما انرسلت الرسالة'); });
    if (d) S.db.doc('deals/' + id).update({ updatedAt:Date.now() }).catch(() => {});
  },
  verify:(uid, v) => { const note = val('v_note'); guard(() => S.db.doc('verif/' + uid).set({ status:v, note, at:Date.now(), by:S.uid }), v === 'verified' ? 'تم التوثيق' : v === 'suspended' ? 'انوقف الحساب' : 'تم التحديث'); },
  withdraw:() => {
    const t = mktTotals(S.uid); const amt = r2(num('w_amt')); const iban = val('w_iban').replace(/\s/g, '').toUpperCase(); const holder = val('w_holder');
    if (!(amt >= MIN_WITHDRAW) || amt > t.available) return setErr('w_err', `المبلغ لازم يكون بين ${MIN_WITHDRAW} و ${sar(t.available)}`);
    if (!/^SA\d{22}$/.test(iban)) return setErr('w_err', 'الآيبان السعودي يبدأ بـ SA وبعده 22 رقم');
    if (holder.length < 3) return setErr('w_err', 'اكتب اسم صاحب الحساب');
    const cur = S.payouts[S.uid]?.requests || [];
    guard(async () => { await S.db.doc('payouts/' + S.uid).set({ requests:cur.concat({ id:'w' + Date.now().toString(36), amount:amt, iban, holder, status:'pending', at:Date.now() }) }); S.sheet = null; }, 'انرسل طلب السحب');
  },
  payoutSet:(rid, v, el) => {
    const uid = el.dataset.u; const reqs = (S.payouts[uid]?.requests || []).map(r => r.id === rid ? { ...r, status:v, doneAt:Date.now() } : r);
    guard(() => S.db.doc('payouts/' + uid).set({ requests:reqs }), v === 'paid' ? 'تم تسجيل التحويل' : 'انرفض الطلب');
  },
};
function createDeal(offerId, price, note){
  const o = offerOf(offerId); if (!o) return;
  if (S.deals.some(d => d.offerId === offerId && d.mktId === S.uid && !['rejected','cancelled'].includes(d.status))) return toast('قدمت على هذه الحملة من قبل');
  const now = Date.now();
  guard(async () => {
    const ref = await S.db.collection('deals').add({ offerId, offerTitle:o.title, brandId:o.brandId, mktId:S.uid, price, status:'proposed', turn:'brand', lastNote:note, createdAt:now, updatedAt:now, log:[logEntry(price === o.budget && !note ? 'قبول الميزانية' : 'تقديم بسعر مقترح', { price, note })] });
    S.sheet = null; S.stack = []; S.tab = 'deals'; go('deal', { id:ref.id });
  }, 'انرسل طلبك للبراند');
}

boot();
</script>
